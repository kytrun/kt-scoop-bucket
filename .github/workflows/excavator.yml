name: Excavator
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  excavate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - uses: ScoopInstaller/Excavator@master
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: "1"
